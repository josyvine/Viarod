<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Map Assistance - Gemini Live Engine</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: Arial, sans-serif;
      background: transparent;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      pointer-events: none; /* GLITCH FIX: Let map gestures (zoom/pan) pass through */
    }

    /* Floating Top Status Header */
    .top-status-bar {
      position: fixed;
      top: 15px;
      left: 15px;
      right: 15px;
      background: rgba(15, 23, 42, 0.90);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 10px 14px;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: auto;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .status-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .status-title {
      font-size: 13px;
      font-weight: bold;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-sub {
      font-size: 11px;
      color: #94a3b8;
      font-family: monospace;
    }

    .header-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
    }

    .header-btn:active {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Bottom Control Bar hosting Puter TTS Sparkle Button */
    .bottom-control-bar {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 32px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      pointer-events: auto;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .action-button {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5f6368;
      width: 48px;
      height: 48px;
      position: relative;
    }

    .voice-agent-btn-cls {
      color: #1a73e8;
    }

    /* Puter Sparkle Indicator System */
    .ai-indicator {
      position: relative;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #voiceAgentIcon {
      color: #38bdf8 !important;
      font-size: 28px;
      display: inline-block;
      transform-origin: center;
      transition: transform 0.2s;
    }

    .orbit-star {
      position: absolute;
      left: 50%;
      top: 50%;
      margin-left: -5px;
      margin-top: -6px;
      transform-origin: 0 0;
      color: #38bdf8;
      font-size: 12px;
      line-height: 1;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      will-change: transform, opacity, filter;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }

    @keyframes orbit {
      from { transform: rotate(0deg) translateX(20px) rotate(0deg); }
      to { transform: rotate(360deg) translateX(20px) rotate(-360deg); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    @keyframes webview-hue-shift {
      0% { filter: hue-rotate(0deg) saturate(1.2); }
      50% { filter: hue-rotate(180deg) saturate(1.6); }
      100% { filter: hue-rotate(360deg) saturate(1.2); }
    }

    #voiceAgentIcon.sparkle-active {
      display: inline-block !important;
      transform-origin: center !important;
      will-change: transform, filter;
      animation: pulse 1.2s infinite ease-in-out !important, webview-hue-shift 3s infinite linear !important;
    }

    #voiceAgentIcon.sparkle-active ~ .orbit-star {
      visibility: visible;
      opacity: 1;
    }

    #voiceAgentIcon.sparkle-active ~ .orbit-star.s1 {
      animation: orbit 2s linear infinite, blink 1s ease-in-out infinite, webview-hue-shift 3s infinite linear !important;
    }

    #voiceAgentIcon.sparkle-active ~ .orbit-star.s2 {
      animation: orbit 3s linear infinite, blink 1.3s ease-in-out infinite, webview-hue-shift 3s infinite linear !important;
    }

    #voiceAgentIcon.sparkle-active ~ .orbit-star.s3 {
      animation: orbit 4s linear infinite, blink 0.8s ease-in-out infinite, webview-hue-shift 3s infinite linear !important;
    }

    /* Live Output Transcript Overlay Card */
    .transcript-overlay {
      position: fixed;
      bottom: 88px;
      left: 15px;
      right: 15px;
      background: rgba(15, 23, 42, 0.90);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 16px;
      padding: 12px 16px;
      color: #f8fafc;
      font-size: 13px;
      line-height: 1.5;
      max-height: 140px;
      overflow-y: auto;
      pointer-events: auto;
      display: none;
      z-index: 90;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    .transcript-speaker {
      font-size: 10px;
      font-weight: bold;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    /* Gemini Settings Drawer */
    .settings-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      z-index: 200;
      padding: 24px 20px;
      display: none;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      pointer-events: auto;
      color: #f8fafc;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 12px;
    }

    .drawer-title {
      font-size: 16px;
      font-weight: bold;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: bold;
      color: #94a3b8;
    }

    .form-group input[type="text"],
    .form-group input[type="password"],
    .form-group select {
      width: 100%;
      padding: 10px 14px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 13px;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: #38bdf8;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .checkbox-group input {
      width: 18px;
      height: 18px;
      accent-color: #0284c7;
    }

    .save-btn {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .save-btn:active {
      background: #0369a1;
    }

    /* Diagnostic Log Terminal Modal */
    .diagnostic-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 15, 30, 0.96);
      backdrop-filter: blur(12px);
      z-index: 300;
      padding: 20px;
      display: none;
      flex-direction: column;
      gap: 12px;
      color: #00ff00;
      font-family: monospace;
      pointer-events: auto;
    }

    .diag-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #00ff00;
      padding-bottom: 8px;
      color: #00ff00;
      font-size: 14px;
      font-weight: bold;
    }

    .diag-terminal {
      flex: 1;
      background: #000000;
      border: 1px solid #00ff00;
      border-radius: 6px;
      padding: 12px;
      overflow-y: auto;
      font-size: 11px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .diag-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .diag-btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      border: none;
    }

    .diag-btn-copy {
      background: #00ff00;
      color: #000000;
    }

    .diag-btn-close {
      background: #222222;
      color: #00ff00;
      border: 1px solid #00ff00;
    }
  </style>
</head>
<body>

  <!-- Top Floating Header -->
  <div class="top-status-bar">
    <div class="status-info">
      <div class="status-title">
        <span class="material-symbols-outlined" style="font-size: 18px;">explore</span>
        <span>Map Assistance Live AI</span>
      </div>
      <div class="status-sub" id="headerSpatialText">GPS: Acquiring... | Heading: 0° N</div>
    </div>
    <button class="header-btn" onclick="toggleSettingsDrawer()" title="Settings">
      <span class="material-symbols-outlined" style="font-size: 20px;">settings</span>
    </button>
  </div>

  <!-- Live Audio Output Transcript Overlay -->
  <div class="transcript-overlay" id="transcriptOverlay">
    <div class="transcript-speaker" id="transcriptSpeaker">Gemini Live</div>
    <div id="transcriptBody">Connecting to Gemini Live...</div>
  </div>

  <!-- Bottom Floating Control Bar -->
  <div class="bottom-control-bar">
    <button class="header-btn" onclick="toggleSettingsDrawer()" title="Configure Models">
      <span class="material-symbols-outlined" style="font-size: 20px;">tune</span>
    </button>

    <!-- Puter Sparkle / Live Audio Toggle Button -->
    <button class="action-button voice-agent-btn-cls" onclick="triggerVoiceAgent()" title="Talk to Gemini Live">
      <div class="ai-indicator">
        <span id="voiceAgentIcon" class="material-symbols-outlined">auto_awesome</span>
        <span class="orbit-star s1">✦</span>
        <span class="orbit-star s2">✦</span>
        <span class="orbit-star s3">✦</span>
      </div>
    </button>

    <button class="header-btn" onclick="openDiagnosticModal()" title="View Diagnostic Logs">
      <span class="material-symbols-outlined" style="font-size: 20px;">bug_report</span>
    </button>
  </div>

  <!-- Gemini Settings Drawer -->
  <div class="settings-drawer" id="settingsDrawer">
    <div class="drawer-header">
      <div class="drawer-title">
        <span class="material-symbols-outlined">settings_suggest</span>
        <span>Gemini Live Settings</span>
      </div>
      <button class="header-btn" onclick="toggleSettingsDrawer()">
        <span class="material-symbols-outlined" style="font-size: 20px;">close</span>
      </button>
    </div>

    <div class="form-group">
      <label for="geminiApiKeyInput">Gemini API Key</label>
      <input type="password" id="geminiApiKeyInput" placeholder="Paste AIzaSy... API key" />
    </div>

    <div class="form-group">
      <label for="geminiModelSelect">Live Model Selection</label>
      <select id="geminiModelSelect">
        <option value="gemini-3.1-flash-live-preview" selected>Gemini 3.1 Flash Live Preview</option>
        <option value="gemini-2.5-flash-native-audio-preview-12-2025">Gemini 2.5 Flash Native Audio</option>
        <option value="gemini-2.0-flash-exp">Gemini 2.0 Flash Exp (Live)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="geminiVoiceSelect">TTS Voice Character</label>
      <select id="geminiVoiceSelect">
        <option value="Aoede">Aoede (Breezy)</option>
        <option value="Charon">Charon (Informative)</option>
        <option value="Kore">Kore (Firm)</option>
        <option value="Puck" selected>Puck (Upbeat)</option>
        <option value="Fenrir">Fenrir (Excitable)</option>
        <option value="Leda">Leda (Youthful)</option>
        <option value="Zephyr">Zephyr (Bright)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Grounding Tools</label>
      <label class="checkbox-group">
        <input type="checkbox" id="geminiMapsGroundingToggle" checked />
        <span>Google Maps Grounding (google_maps)</span>
      </label>
      <label class="checkbox-group" style="margin-top: 6px;">
        <input type="checkbox" id="geminiSearchGroundingToggle" checked />
        <span>Google Search Grounding (google_search)</span>
      </label>
    </div>

    <button class="save-btn" onclick="openDiagnosticModal()">View Terminal Diagnostic Log</button>
    <button class="save-btn" onclick="saveSettingsAndClose()">Save & Apply Configurations</button>
  </div>

  <!-- Diagnostic Terminal Modal -->
  <div class="diagnostic-modal" id="diagnosticLogModal">
    <div class="diag-header">
      <span>System Terminal Diagnostic Log</span>
      <button class="header-btn" onclick="closeDiagnosticModal()">
        <span class="material-symbols-outlined" style="font-size: 18px;">close</span>
      </button>
    </div>
    <div class="diag-terminal" id="diagTerminalText">Initializing Map Assistance Terminal Logs...\n</div>
    <div class="diag-actions">
      <button class="diag-btn diag-btn-copy" onclick="copyDiagnosticLogs()">Copy Logs</button>
      <button class="diag-btn diag-btn-close" onclick="closeDiagnosticModal()">Close</button>
    </div>
  </div>

  <script>
    // Global Error Interceptor
    window.onerror = function(msg, url, line, col, error) {
      logDiag(`[ERROR] Exception: ${msg} at line ${line}:${col}`, "error");
      return false;
    };

    window.onunhandledrejection = function(e) {
      logDiag(`[PROMISE_REJECTION] ${e.reason}`, "error");
    };

    function logDiag(message, type = "info") {
      const term = document.getElementById('diagTerminalText');
      if (term) {
        const ts = new Date().toLocaleTimeString();
        term.textContent += `[${ts}] [${type.toUpperCase()}] ${message}\n`;
        term.scrollTop = term.scrollHeight;
      }
    }

    function openDiagnosticModal() {
      document.getElementById('diagnosticLogModal').style.display = 'flex';
    }

    function closeDiagnosticModal() {
      document.getElementById('diagnosticLogModal').style.display = 'none';
    }

    // FIX: Route copy action through Native Android ClipboardManager to eliminate Write Permission Denied error
    function copyDiagnosticLogs() {
      const text = document.getElementById('diagTerminalText').textContent;
      if (window.AndroidInterface && window.AndroidInterface.copyToClipboard) {
        window.AndroidInterface.copyToClipboard(text);
        logDiag("Copied logs via native Android ClipboardManager.", "info");
      } else {
        try {
          navigator.clipboard.writeText(text);
          alert("Diagnostic log copied to clipboard.");
        } catch(e) {
          logDiag("Clipboard copy failed: " + e.message, "error");
        }
      }
    }

    // System State Variables
    let liveWs = null;
    let liveAudioContext = null;
    let liveAudioProcessor = null;
    let liveMicStream = null;
    let livePlayCtx = null;
    let nextPlayTime = 0;
    let activeSources = [];
    let isLiveSessionConnected = false;

    // Load Settings on Start
    window.addEventListener('DOMContentLoaded', () => {
      logDiag("Map Assistance HTML Engine initialized.", "info");
      loadSettingsFromNative();
      updateHeaderSpatialText();
      setInterval(updateHeaderSpatialText, 1000);
    });

    function loadSettingsFromNative() {
      if (window.AndroidInterface) {
        try {
          document.getElementById('geminiApiKeyInput').value = window.AndroidInterface.getGeminiApiKey() || '';
          document.getElementById('geminiModelSelect').value = window.AndroidInterface.getGeminiModel() || 'gemini-3.1-flash-live-preview';
          document.getElementById('geminiVoiceSelect').value = window.AndroidInterface.getGeminiVoice() || 'Puck';
          document.getElementById('geminiMapsGroundingToggle').checked = window.AndroidInterface.getMapGroundingEnabled();
          document.getElementById('geminiSearchGroundingToggle').checked = window.AndroidInterface.getSearchGroundingEnabled();
          logDiag("Settings loaded from native AndroidInterface.", "info");
        } catch(e) {
          logDiag("Error loading settings from bridge: " + e.message, "error");
        }
      }
    }

    function saveSettingsAndClose() {
      const apiKey = document.getElementById('geminiApiKeyInput').value.trim();
      const model = document.getElementById('geminiModelSelect').value;
      const voice = document.getElementById('geminiVoiceSelect').value;
      const mapsGround = document.getElementById('geminiMapsGroundingToggle').checked;
      const searchGround = document.getElementById('geminiSearchGroundingToggle').checked;

      if (window.AndroidInterface) {
        window.AndroidInterface.saveGeminiApiKey(apiKey);
        window.AndroidInterface.saveGeminiModel(model);
        window.AndroidInterface.saveGeminiVoice(voice);
        window.AndroidInterface.saveMapGroundingEnabled(mapsGround);
        window.AndroidInterface.saveSearchGroundingEnabled(searchGround);
        window.AndroidInterface.showToast("Map Assistance settings saved!");
        logDiag("Settings saved to native SharedPreferences.", "info");
      }

      toggleSettingsDrawer();
    }

    function toggleSettingsDrawer() {
      const drawer = document.getElementById('settingsDrawer');
      drawer.style.display = (drawer.style.display === 'flex') ? 'none' : 'flex';
    }

    function updateHeaderSpatialText() {
      if (window.AndroidInterface) {
        try {
          const gpsRaw = window.AndroidInterface.getGpsLocation();
          const compassRaw = window.AndroidInterface.getCompassHeading();
          const gps = JSON.parse(gpsRaw);
          const compass = JSON.parse(compassRaw);

          const el = document.getElementById('headerSpatialText');
          if (el) {
            el.textContent = `GPS: ${gps.lat.toFixed(4)}, ${gps.lng.toFixed(4)} | Facing: ${compass.degrees.toFixed(0)}° ${compass.direction}`;
          }
        } catch(e) {}
      }
    }

    function clearLiveTranscript() {
      const body = document.getElementById('transcriptBody');
      if (body) body.textContent = '';
      document.getElementById('transcriptOverlay').style.display = 'none';
    }

    function setTranscriptText(speaker, text) {
      const overlay = document.getElementById('transcriptOverlay');
      const speakerEl = document.getElementById('transcriptSpeaker');
      const bodyEl = document.getElementById('transcriptBody');

      if (overlay && speakerEl && bodyEl) {
        overlay.style.display = 'block';
        speakerEl.textContent = speaker;
        bodyEl.textContent = text;
        overlay.scrollTop = overlay.scrollHeight;
      }
      logDiag(`[${speaker}] ${text}`, "info");
    }

    function appendTranscriptText(text) {
      const overlay = document.getElementById('transcriptOverlay');
      const bodyEl = document.getElementById('transcriptBody');

      if (overlay && bodyEl) {
        overlay.style.display = 'block';
        bodyEl.textContent += text;
        overlay.scrollTop = overlay.scrollHeight;
      }
    }

    /* --- PUTER SPARKLE BUTTON & LIVE TOGGLE ACTION --- */
    function triggerVoiceAgent() {
      if (liveWs && (liveWs.readyState === WebSocket.OPEN || liveWs.readyState === WebSocket.CONNECTING)) {
        logDiag("User clicked to disconnect Gemini Live.", "info");
        disconnectWebSocketLive();
        return;
      }

      const icon = document.getElementById('voiceAgentIcon');
      if (icon) icon.classList.add('sparkle-active');

      switchToLiveMode();
    }

    function switchToLiveMode() {
      let apiKey = document.getElementById('geminiApiKeyInput').value.trim();
      if (!apiKey && window.AndroidInterface) {
        apiKey = window.AndroidInterface.getGeminiApiKey();
      }

      if (!apiKey) {
        alert("Please enter a valid Gemini API Key in settings.");
        logDiag("Live switch aborted: Missing API Key.", "error");
        const icon = document.getElementById('voiceAgentIcon');
        if (icon) icon.classList.remove('sparkle-active');
        toggleSettingsDrawer();
        return;
      }

      const modelId = document.getElementById('geminiModelSelect').value;
      const voiceName = document.getElementById('geminiVoiceSelect').value;
      const enableMaps = document.getElementById('geminiMapsGroundingToggle').checked;
      const enableSearch = document.getElementById('geminiSearchGroundingToggle').checked;

      connectWebSocketLive(apiKey, modelId, voiceName, enableMaps, enableSearch);
    }

    function connectWebSocketLive(apiKey, modelId, voiceName, enableMaps, enableSearch) {
      disconnectWebSocketLive();

      setTranscriptText("System", "Connecting to Gemini Live API...");
      logDiag(`Connecting to Gemini Live WebSocket. Model: ${modelId}, Voice: ${voiceName}`, "info");

      const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${apiKey}`;

      try {
        liveWs = new WebSocket(url);
      } catch(e) {
        setTranscriptText("Error", "WebSocket creation failed: " + e.message);
        logDiag("WebSocket construction exception: " + e.message, "error");
        const icon = document.getElementById('voiceAgentIcon');
        if (icon) icon.classList.remove('sparkle-active');
        return;
      }

      liveWs.onopen = () => {
        logDiag("WebSocket onopen fired. Constructing setup payload...", "info");

        // FIX: Model Compatibility Guard - Prevent Code 1007 WebSocket rejection on gemini-2.5-flash-native-audio
        const isMapsSupported = !modelId.includes("2.5-flash-native-audio");
        
        // Construct tools array based on settings and model support
        const tools = [];
        if (enableMaps && isMapsSupported) {
          tools.push({ google_maps: {} });
        } else if (enableMaps && !isMapsSupported) {
          logDiag("Omitted google_maps tool: Not supported on " + modelId + " to prevent Code 1007 rejection.", "warning");
        }
        
        if (enableSearch) {
          tools.push({ google_search: {} });
        }

        // FIX: DYNAMIC NO-HARDCODING GPS & SPATIAL RULE ENFORCEMENT
        let spatialPrompt = "You are a real-time local Map Assistance Voice AI assistant.\n";
        if (window.AndroidInterface) {
          try {
            const gps = JSON.parse(window.AndroidInterface.getGpsLocation());
            const compass = JSON.parse(window.AndroidInterface.getCompassHeading());
            
            spatialPrompt += `CRITICAL LIVE LOCATION & COMPASS RULES:\n`;
            spatialPrompt += `- Your user's current live GPS coordinates are Latitude: ${gps.lat}, Longitude: ${gps.lng} (Accuracy: ±${gps.accuracy.toFixed(1)}m).\n`;
            spatialPrompt += `- You MUST perform all local searches and place recommendations strictly relative to Latitude ${gps.lat}, Longitude ${gps.lng}.\n`;
            spatialPrompt += `- Do NOT guess, assume, or hallucinate cities, streets, or landmarks (such as Aluva, Palace Road, etc.) outside of your user's immediate GPS radius.\n`;
            spatialPrompt += `- User Facing Compass Direction: ${compass.degrees.toFixed(0)}° (${compass.direction}). When asked for places to their West, South, East, or North, filter options relative to their current orientation (${compass.direction}).\n`;
          } catch(e) {
            logDiag("Error fetching live GPS/Compass bridge data: " + e.message, "error");
          }
        }

        spatialPrompt += `\nOPERATIONAL NAVIGATION DIRECTIVES:\n`;
        spatialPrompt += `1. Always prioritize local knowledge near the user's live GPS coordinates first before out-of-premises information.\n`;
        spatialPrompt += `2. If the user asks to navigate or find a place, respond clearly in audio and instruct the map to plot route markers.\n`;

        const setupMessage = {
          setup: {
            model: "models/" + modelId,
            generationConfig: {
              responseModalities: ["AUDIO"],
              speechConfig: {
                voiceConfig: {
                  prebuiltVoiceConfig: { voiceName: voiceName }
                }
              }
            },
            systemInstruction: {
              parts: [{ text: spatialPrompt }]
            },
            tools: tools.length > 0 ? tools : undefined,
            inputAudioTranscription: {},
            outputAudioTranscription: {}
          }
        };

        liveWs.send(JSON.stringify(setupMessage));
        logDiag("Setup message frame sent to Gemini with dynamic live GPS coordinates.", "info");
      };

      liveWs.onmessage = async (event) => {
        try {
          let payload;
          if (event.data instanceof Blob) {
            const text = await event.data.text();
            payload = JSON.parse(text);
          } else {
            payload = JSON.parse(event.data);
          }

          if (payload.setupComplete) {
            isLiveSessionConnected = true;
            setTranscriptText("Gemini Live", "Connected & Listening... Ask for local places or directions!");
            logDiag("Gemini setupComplete received. Initializing microphone...", "info");
            initMicrophoneCaptureLive();
            return;
          }

          if (payload.serverContent) {
            const content = payload.serverContent;

            // Handle Barge-In Interruption
            if (content.interrupted) {
              clearPlaybackQueueLive();
              appendTranscriptText(" [Interrupted]");
              logDiag("Barge-in interruption packet received.", "info");
            }

            if (content.modelTurn && content.modelTurn.parts) {
              for (const part of content.modelTurn.parts) {
                if (part.text) {
                  appendTranscriptText(part.text);
                  checkAndTriggerRoutePlot(part.text);
                }
                if (part.inlineData && part.inlineData.data) {
                  scheduleAudioChunkPlayLive(part.inlineData.data);
                }
              }
            }

            if (content.outputTranscription && content.outputTranscription.text) {
              appendTranscriptText(content.outputTranscription.text);
            }
          }
        } catch(e) {
          logDiag("Error parsing WebSocket message: " + e.message, "error");
        }
      };

      liveWs.onclose = (e) => {
        logDiag(`WebSocket onclose fired. Code: ${e.code}, Reason: ${e.reason || 'None'}`, "warning");
        disconnectWebSocketLive();
      };

      liveWs.onerror = (e) => {
        setTranscriptText("Error", "Live connection error occurred.");
        logDiag("WebSocket onerror fired.", "error");
        disconnectWebSocketLive();
      };
    }

    /* --- REAL-TIME 16kHz PCM MICROPHONE CAPTURE --- */
    async function initMicrophoneCaptureLive() {
      try {
        logDiag("Requesting user media audio stream...", "info");
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        liveMicStream = stream;
        logDiag("Microphone media stream acquired successfully.", "info");

        liveAudioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        const source = liveAudioContext.createMediaStreamSource(stream);
        liveAudioProcessor = liveAudioContext.createScriptProcessor(2048, 1, 1);

        liveAudioProcessor.onaudioprocess = (e) => {
          if (!liveWs || liveWs.readyState !== WebSocket.OPEN) return;

          const inputFloat32 = e.inputBuffer.getChannelData(0);
          const pcmBuffer = new ArrayBuffer(inputFloat32.length * 2);
          const pcmView = new DataView(pcmBuffer);

          for (let i = 0; i < inputFloat32.length; i++) {
            let sample = Math.max(-1, Math.min(1, inputFloat32[i]));
            let int16Sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
            pcmView.setInt16(i * 2, int16Sample, true);
          }

          const base64AudioChunk = arrayBufferToBase64(pcmBuffer);

          liveWs.send(JSON.stringify({
            realtimeInput: {
              audio: {
                mimeType: "audio/pcm;rate=16000",
                data: base64AudioChunk
              }
            }
          }));
        };

        source.connect(liveAudioProcessor);
        liveAudioProcessor.connect(liveAudioContext.destination);

      } catch(e) {
        setTranscriptText("Error", "Microphone access denied or unsupported: " + e.message);
        logDiag("getUserMedia failed: " + e.name + " (" + e.message + ")", "error");
      }
    }

    /* --- REAL-TIME 24kHz PCM AUDIO PLAYBACK SCHEDULER --- */
    function scheduleAudioChunkPlayLive(base64Data) {
      try {
        if (!livePlayCtx) {
          livePlayCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
        }

        const rawBuffer = base64ToArrayBuffer(base64Data);
        const int16Samples = new Int16Array(rawBuffer);
        const float32Samples = new Float32Array(int16Samples.length);

        for (let i = 0; i < int16Samples.length; i++) {
          float32Samples[i] = int16Samples[i] / 32768.0;
        }

        const audioBuffer = livePlayCtx.createBuffer(1, float32Samples.length, 24000);
        audioBuffer.copyToChannel(float32Samples, 0);

        const sourceNode = livePlayCtx.createBufferSource();
        sourceNode.buffer = audioBuffer;
        sourceNode.connect(livePlayCtx.destination);

        const currentTime = livePlayCtx.currentTime;
        if (nextPlayTime < currentTime) {
          nextPlayTime = currentTime + 0.05;
        }

        sourceNode.start(nextPlayTime);
        activeSources.push({
          source: sourceNode,
          endTime: nextPlayTime + audioBuffer.duration
        });

        nextPlayTime += audioBuffer.duration;
        activeSources = activeSources.filter(item => item.endTime > currentTime);

      } catch(e) {
        logDiag("Audio playback scheduling error: " + e.message, "error");
      }
    }

    function clearPlaybackQueueLive() {
      activeSources.forEach(item => {
        try { item.source.stop(); } catch(e) {}
      });
      activeSources = [];
      nextPlayTime = 0;
    }

    function disconnectWebSocketLive() {
      isLiveSessionConnected = false;

      const icon = document.getElementById('voiceAgentIcon');
      if (icon) icon.classList.remove('sparkle-active');

      if (liveMicStream) {
        try { liveMicStream.getTracks().forEach(t => t.stop()); } catch(e) {}
        liveMicStream = null;
      }
      if (liveAudioProcessor) {
        try { liveAudioProcessor.disconnect(); } catch(e) {}
        liveAudioProcessor = null;
      }
      if (liveAudioContext) {
        try { liveAudioContext.close(); } catch(e) {}
        liveAudioContext = null;
      }
      clearPlaybackQueueLive();
      if (livePlayCtx) {
        try { livePlayCtx.close(); } catch(e) {}
        livePlayCtx = null;
      }
      if (liveWs) {
        try { liveWs.close(); } catch(e) {}
        liveWs = null;
      }
      logDiag("Live session disconnected cleanly.", "info");
    }

    function checkAndTriggerRoutePlot(text) {
      if (window.AndroidInterface && text) {
        const coordMatch = text.match(/destination\s*:\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/i);
        if (coordMatch) {
          const lat = parseFloat(coordMatch[1]);
          const lng = parseFloat(coordMatch[2]);
          window.AndroidInterface.plotRouteToDestination("Target Attraction", lat, lng);
          logDiag(`Route plot command triggered for destination: ${lat}, ${lng}`, "info");
        }
      }
    }

    // Helper Conversion Utilities
    function base64ToArrayBuffer(base64) {
      const binaryString = window.atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    function arrayBufferToBase64(buffer) {
      let binary = '';
      const bytes = new Uint8Array(buffer);
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return window.btoa(binary);
    }
  </script>
